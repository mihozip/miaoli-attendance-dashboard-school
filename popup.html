<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>全校出缺席看板小助手</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{width:430px;margin:0;background:#f5f7fb;color:#1f2937;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
header{background:white;border-bottom:1px solid #dfe4ea;padding:15px 16px 11px}h1{font-size:17px;margin:0 0 4px}.sub{font-size:12px;color:#667085}
main{padding:12px}.card{background:white;border:1px solid #dfe4ea;border-radius:12px;padding:12px;margin-bottom:10px}.hero{text-align:center}.big{font-size:36px;font-weight:800}.caption{font-size:12px;color:#667085}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{border:1px solid #e2e8f0;border-radius:10px;padding:10px}.stat .n{font-size:22px;font-weight:800}.stat .t{font-size:11px;color:#667085}
.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0}.label{font-size:12px;color:#667085}.value{font-size:12px;font-weight:650;text-align:right}.ok{color:#16803c}.bad{color:#b42318}.warn{color:#9a6700}
button{width:100%;border:0;border-radius:9px;padding:10px 12px;background:#2563eb;color:white;font-size:14px;margin-top:8px;cursor:pointer}.secondary{background:white;color:#2563eb;border:1px solid #b9cdfb}.ghost{background:#eef2ff;color:#3446a8}
.list{max-height:260px;overflow:auto}.item{padding:8px 0;border-bottom:1px dashed #e6e8ed}.item:last-child{border-bottom:0}.item-top{display:flex;justify-content:space-between;font-size:12px;font-weight:700}.item-sub{font-size:11px;color:#667085;margin-top:3px}
.note{font-size:10.5px;color:#667085;line-height:1.5}
</style>
</head>
<body>
<header><h1>🏫 全校出缺席看板小助手</h1><div class="sub">V0.5.9-school｜自動讀取處室代碼；必要時自動校驗與補抓全校出缺席</div></header>
<main>
  <div class="card hero"><div id="currentCount" class="big">—</div><div class="caption">目前不在人數</div></div>
  <div class="card stats">
    <div class="stat"><div id="todayCount" class="n">—</div><div class="t">今日異動人員</div></div>
    <div class="stat"><div id="recordCount" class="n">—</div><div class="t">今日差勤紀錄筆數</div></div>
  </div>
  <div class="card">
    <div class="row"><span class="label">查詢範圍</span><span class="value">全校／所有處室</span></div>
    <div class="row"><span class="label">同步狀態</span><span id="session" class="value">尚未同步</span></div>
    <div class="row"><span class="label">最後成功同步</span><span id="updated" class="value">—</span></div>
    <div class="row"><span class="label">下一個人力異動</span><span id="nextChange" class="value">—</span></div>
    <button id="sync">立即同步</button>
    <button id="openDashboard" class="ghost">開啟全螢幕全校出缺席看板</button>
    <button id="openAttendance" class="secondary">開啟苗栗差勤系統</button>
  </div>
  <div class="card"><strong style="font-size:12px">今日全校差勤</strong><div id="list" class="list"><div class="note">尚無資料</div></div></div>
  <div class="card">
    <div class="note">直接讀取差勤系統「請選擇處室」下拉選單的真實單位代碼，再逐單位同步；工作日 06:30–18:30 每 5 分鐘同步。16:00 視為共同下班時間。只保存看板必要欄位，不保存請假事由、IP、帳號、附件或備註。</div>
  </div>
</main>
<script src="popup.js"></script>
</body></html>
