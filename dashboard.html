<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>全校今日出缺席｜處室看板</title>
<style>
:root{
  color-scheme:light;
  --bg:#eef3f8;
  --panel:#fff;
  --line:#d9e2ec;
  --text:#172033;
  --muted:#64748b;
  --blue:#2563eb;
  --blue-soft:#eff6ff;
  --green:#16803c;
  --green-soft:#ecfdf3;
  --amber:#a16207;
  --amber-soft:#fff7ed;
  --red:#b42318;
  --red-soft:#fff1f2;
  --navy:#173b6c;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
}
.wrap{
  width:min(1900px,100%);
  margin:0 auto;
  padding:22px;
}
.header{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:24px;
  margin-bottom:14px;
}
.title{
  font-size:40px;
  line-height:1.05;
  font-weight:950;
  letter-spacing:.01em;
}
.date{font-size:18px;color:var(--muted);margin-top:5px}
.sync{text-align:right}
.status{font-size:17px;font-weight:850}
.status.ok{color:var(--green)}
.status.warn{color:var(--amber)}
.status.bad{color:var(--red)}
.updated{font-size:14px;color:var(--muted);margin-top:4px}

.summary{
  display:grid;
  grid-template-columns:160px 160px 180px 1fr;
  gap:10px;
  margin-bottom:12px;
}
.kpi,.next-box{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  min-height:92px;
}
.kpi{padding:14px 18px}
.kpi-number{font-size:38px;font-weight:950;line-height:1}
.kpi-label{font-size:14px;color:var(--muted);margin-top:8px}
.next-box{padding:14px 18px}
.next-title{font-size:13px;color:var(--muted);font-weight:800;margin-bottom:9px}
.next-content{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:9px;
  font-size:18px;
}
.next-time{font-size:22px;font-weight:950;color:var(--blue)}
.next-dept{
  padding:4px 9px;
  border-radius:999px;
  background:var(--blue-soft);
  color:#1d4ed8;
  font-weight:850;
}
.next-person{font-weight:900}
.next-action{color:var(--muted);font-weight:800}
.muted{color:var(--muted)}

.warning{
  display:none;
  margin-bottom:12px;
  padding:10px 14px;
  border:1px solid #fed7aa;
  border-radius:12px;
  background:var(--amber-soft);
  color:#9a3412;
  font-weight:750;
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:6px 2px 10px;
}
.section-title{font-size:22px;font-weight:950}
.section-note{font-size:13px;color:var(--muted)}

.department-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
  gap:12px;
}
.dept-card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
  min-height:185px;
  box-shadow:0 2px 8px rgba(15,23,42,.035);
}
.dept-card.has-current{border-color:#efc7cb}
.dept-card.future-only{border-color:#cfdcf6}
.dept-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:13px 16px;
  background:#f8fafc;
  border-bottom:1px solid var(--line);
}
.has-current .dept-head{background:#fff7f7}
.future-only .dept-head{background:#f7faff}
.dept-name{
  font-size:25px;
  font-weight:950;
  color:var(--navy);
}
.dept-count{
  font-size:13px;
  font-weight:850;
  padding:6px 10px;
  border-radius:999px;
  background:#edf2f7;
  color:#475569;
  white-space:nowrap;
}
.has-current .dept-count{background:#ffe4e6;color:#be123c}
.dept-body{padding:13px 16px 15px}
.dept-section-label{
  font-size:12px;
  font-weight:900;
  color:#94a3b8;
  letter-spacing:.06em;
  margin-bottom:6px;
}
.people-list{
  display:grid;
  gap:7px;
}
.person-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:9px 0;
  border-bottom:1px solid #edf1f5;
}
.person-item:last-child{border-bottom:0}
.person-main{min-width:0}
.person-name{
  font-size:27px;
  line-height:1.1;
  font-weight:950;
  color:var(--text);
}
.person-position{
  margin-top:4px;
  font-size:13px;
  color:var(--muted);
}
.person-status{
  text-align:right;
  flex:0 0 auto;
}
.absence{
  font-size:17px;
  font-weight:950;
  color:var(--red);
}
.absence.official{color:#1d4ed8}
.until{
  font-size:13px;
  color:var(--muted);
  margin-top:3px;
  font-weight:700;
}
.present-now{
  padding:10px 0 4px;
  color:var(--green);
  font-weight:850;
}
.future-area{
  margin-top:10px;
  padding-top:10px;
  border-top:1px dashed #d8e1eb;
}
.future-list{display:grid;gap:5px}
.future-item{
  display:grid;
  grid-template-columns:58px 1fr auto;
  align-items:center;
  gap:8px;
  font-size:15px;
}
.future-time{color:var(--blue);font-weight:950}
.future-name{font-weight:850}
.future-action{color:var(--muted);font-weight:800}

.all-clear{
  grid-column:1/-1;
  min-height:230px;
  background:var(--panel);
  border:1px solid #b9e3c8;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:20px;
  color:var(--green);
}
.all-clear-icon{
  width:62px;height:62px;
  display:grid;place-items:center;
  border-radius:50%;
  background:var(--green-soft);
  font-size:34px;
  font-weight:950;
}
.all-clear-title{font-size:28px;font-weight:950}
.all-clear-sub{font-size:15px;color:#4b7f5f;margin-top:5px}

.ended-box{
  display:none;
  margin-top:12px;
  background:rgba(255,255,255,.75);
  border:1px solid var(--line);
  border-radius:14px;
  padding:11px 14px;
}
.ended-title{
  font-size:13px;
  color:var(--muted);
  font-weight:850;
  margin-bottom:6px;
}
.ended-content{
  display:flex;
  flex-wrap:wrap;
  gap:7px 18px;
  font-size:14px;
  color:#64748b;
}
.ended-group strong{color:#475569}

@media(max-width:1100px){
  .summary{grid-template-columns:repeat(3,1fr)}
  .next-box{grid-column:1/-1}
}
@media(max-width:760px){
  .wrap{padding:12px}
  .header{align-items:flex-start}
  .title{font-size:31px}
  .sync{font-size:13px}
  .department-grid{grid-template-columns:1fr}
  .summary{grid-template-columns:repeat(3,1fr)}
  .kpi{padding:12px}
  .kpi-number{font-size:30px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="header">
    <div>
      <div class="title">全校｜今日出缺席</div>
      <div id="date" class="date"></div>
    </div>
    <div class="sync">
      <div id="status" class="status">等待同步</div>
      <div id="updated" class="updated"></div>
    </div>
  </header>

  <section class="summary">
    <div class="kpi">
      <div id="currentCount" class="kpi-number">—</div>
      <div class="kpi-label">目前不在</div>
    </div>
    <div class="kpi">
      <div id="departmentCount" class="kpi-number">—</div>
      <div class="kpi-label">目前涉及處室</div>
    </div>
    <div class="kpi">
      <div id="todayCount" class="kpi-number">—</div>
      <div class="kpi-label">今日異動人員</div>
    </div>
    <div class="next-box">
      <div class="next-title">下一個人力異動</div>
      <div id="nextChange" class="next-content"><span class="muted">—</span></div>
    </div>
  </section>

  <div id="warning" class="warning"></div>

  <div class="section-head">
    <div class="section-title">各處室人力狀態</div>
    <div class="section-note">完整姓名｜依處室分類｜標示休假、事假、補休、出差等原因</div>
  </div>

  <main id="departmentGrid" class="department-grid"></main>

  <section id="endedBox" class="ended-box">
    <div class="ended-title">今日已結束的異動</div>
    <div id="endedContent" class="ended-content"></div>
  </section>
</div>
<script src="dashboard.js"></script>
</body>
</html>
